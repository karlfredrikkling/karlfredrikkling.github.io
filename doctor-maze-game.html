<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Maze Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            text-align: center;
        }

        #caption {
            color: #ffcc00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
        }

        canvas {
            background: #1a1a2e;
            border: 4px solid #16213e;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            cursor: default;
        }

        canvas.clickable {
            cursor: pointer;
        }

        #info {
            color: white;
            margin-top: 15px;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

        function restartGame() {

                x = Math.floor(Math.random() * (MAZE_WIDTH - 2)) + 1;
                y = Math.floor(Math.random() * (MAZE_HEIGHT - 2)) + 1;

        function spawnDot() {

            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 100;
            oscillator.type = 'sawtooth';

            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);

            oscillator.frequency.exponentialRampToValueAtTime(20, audioContext.currentTime + 0.4);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.4);
        }

        // Process input
        function processInput() {
            // Check for start screen - any key or gamepad button starts the game
            if (gameState.current === 'start') {
                let shouldStart = false;

                // Check keyboard input - any key
                for (let key in keys) {
                    if (keys[key]) {
                        shouldStart = true;
                        break;
                    }
                }

                // Check gamepad input - any button
                const gamepads = navigator.getGamepads();
                if (gamepads[0]) {
                    for (let i = 0; i < gamepads[0].buttons.length; i++) {
                        if (gamepads[0].buttons[i].pressed) {
                            shouldStart = true;
                            break;
                        }
                    }
                }

                if (shouldStart) {
                    gameState.current = 'playing';
                    startMusic();
                }
                return;
            }

            // Check for restart on complete screen
            if (gameState.current === 'complete') {
                const gamepads = navigator.getGamepads();
                if (gamepads[0]) {
                    // Options button (button 9 on PlayStation controllers)
                    if (gamepads[0].buttons[9] && gamepads[0].buttons[9].pressed) {
                        restartGame();
                    }
                }
                return;
            }

            if (player.isStunned) return;

            let inputX = 0;
            let inputY = 0;
            player.isSprinting = false;

            // Keyboard input
            if (keys['w'] || keys['arrowup']) inputY = -1;
            if (keys['s'] || keys['arrowdown']) inputY = 1;
            if (keys['a'] || keys['arrowleft']) inputX = -1;
            if (keys['d'] || keys['arrowright']) inputX = 1;

            // Whip attack - spacebar
            if ((keys[' '] || keys['spacebar']) && !player.isWhipping && player.whipCooldown === 0) {
                player.isWhipping = true;
                player.whipTimer = 15; // Animation duration
                player.whipCooldown = 30; // Cooldown between attacks
            }

            // Music toggle - M key
            if (keys['m']) {
                const bgMusic = document.getElementById('bgMusic');
                if (bgMusic.paused) {
                    bgMusic.play().catch(e => console.log('Could not play music'));
                } else {
                    bgMusic.pause();
                }
                keys['m'] = false; // Prevent repeated toggles
            }

            // Gamepad input
            const gamepads = navigator.getGamepads();
            if (gamepads[0]) {
                gamepad = gamepads[0];

                // Sprint - X button (button 1)
                if (gamepad.buttons[1] && gamepad.buttons[1].pressed) {
                    player.isSprinting = true;
                }

                // Whip attack - Square button (button 0)
                if (gamepad.buttons[0] && gamepad.buttons[0].pressed && !player.isWhipping && player.whipCooldown === 0) {
                    player.isWhipping = true;
                    player.whipTimer = 15;
                    player.whipCooldown = 30;
                }

                // D-pad
                if (gamepad.buttons[12] && gamepad.buttons[12].pressed) inputY = -1;
                if (gamepad.buttons[13] && gamepad.buttons[13].pressed) inputY = 1;
                if (gamepad.buttons[14] && gamepad.buttons[14].pressed) inputX = -1;
                if (gamepad.buttons[15] && gamepad.buttons[15].pressed) inputX = 1;

                // Analog stick (with deadzone)
                const deadzone = 0.15;
                if (Math.abs(gamepad.axes[0]) > deadzone) {
                    inputX = gamepad.axes[0] > 0 ? 1 : -1;
                }
                if (Math.abs(gamepad.axes[1]) > deadzone) {
                    inputY = gamepad.axes[1] > 0 ? 1 : -1;
                }
            }

            // Update player direction
            if (inputX !== 0 || inputY !== 0) {
                if (Math.abs(inputX) > Math.abs(inputY)) {
                    player.direction = inputX > 0 ? 'right' : 'left';
                } else {
                    player.direction = inputY > 0 ? 'down' : 'up';
                }
            }

            // Calculate new position with sprint
            const currentSpeed = player.isSprinting ? player.speed * 2 : player.speed;
            const newX = player.x + inputX * currentSpeed;
            const newY = player.y + inputY * currentSpeed;

            // Check wall collision
            if (!checkWallCollision(newX, player.y)) {
                player.x = newX;
            }
            if (!checkWallCollision(player.x, newY)) {
                player.y = newY;
            }

            // Update grid position
            player.gridX = Math.floor(player.x / CELL_SIZE);
            player.gridY = Math.floor(player.y / CELL_SIZE);
        }

        // Check wall collision
        function checkWallCollision(x, y) {
            const gridX = Math.floor(x / CELL_SIZE);
            const gridY = Math.floor(y / CELL_SIZE);

            if (gridY < 0 || gridY >= MAZE_HEIGHT || gridX < 0 || gridX >= MAZE_WIDTH) {
                return true;
            }

            return currentMaze[gridY][gridX] === 1;
        }

        // Update enemies
        function updateEnemies() {
            enemies.forEach(enemy => {
                // Change direction timer
                enemy.changeDirectionTimer--;
                if (enemy.changeDirectionTimer <= 0) {
                    const directions = ['up', 'down', 'left', 'right'];
                    enemy.direction = directions[Math.floor(Math.random() * 4)];
                    enemy.changeDirectionTimer = Math.floor(Math.random() * 120) + 60;
                }

                // Move enemy
                let newX = enemy.x;
                let newY = enemy.y;

                switch(enemy.direction) {
                    case 'up': newY -= enemy.speed; break;
                    case 'down': newY += enemy.speed; break;
                    case 'left': newX -= enemy.speed; break;
                    case 'right': newX += enemy.speed; break;
                }

                // Check wall collision
                if (checkWallCollision(newX, newY)) {
                    // Change direction on collision
                    const directions = ['up', 'down', 'left', 'right'];
                    enemy.direction = directions[Math.floor(Math.random() * 4)];
                } else {
                    enemy.x = newX;
                    enemy.y = newY;
                    enemy.gridX = Math.floor(enemy.x / CELL_SIZE);
                    enemy.gridY = Math.floor(enemy.y / CELL_SIZE);
                }
            });
        }

        // Check collisions
        function checkCollisions() {
            // Dot collision
            const dotDist = Math.hypot(player.x - dotSystem.x, player.y - dotSystem.y);
            if (dotDist < player.size + dotSystem.size) {
                dotSystem.dotsCollected++;
                dotSystem.showMessage = true;
                dotSystem.messageTimer = MESSAGE_DURATION;
                playHappySound();

                if (dotSystem.dotsCollected < 5) {
                    spawnDot();
                }
            }

            // Whip collision with enemies
            if (player.isWhipping) {
                // Calculate whip position
                const whipDistance = 40;
                let whipX = player.x;
                let whipY = player.y;

                switch(player.direction) {
                    case 'right': whipX += whipDistance; break;
                    case 'left': whipX -= whipDistance; break;
                    case 'down': whipY += whipDistance; break;
                    case 'up': whipY -= whipDistance; break;
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    const dist = Math.hypot(whipX - enemy.x, whipY - enemy.y);
                    if (dist < 25) {
                        // Kill enemy
                        enemies.splice(i, 1);
                        playExplosionSound();

                        // Create explosion particles (simple visual feedback)
                        enemy.exploded = true;
                    }
                }
            }

            // Enemy collision
            if (!player.isStunned) {
                enemies.forEach(enemy => {
                    const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                    if (dist < player.size + enemy.size) {
                        // Stun player
                        player.isStunned = true;
                        player.stunTimer = STUN_DURATION;

                        // Knockback
                        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                        player.knockbackX = Math.cos(angle) * 30;
                        player.knockbackY = Math.sin(angle) * 30;
                    }
                });
            }

            // Door collision
            if (dotSystem.dotsCollected >= 5) {
                const doorX = 8;
                const doorY = 6;
                if (player.gridX === doorX && player.gridY === doorY) {
                    // Level complete
                    nextLevel();
                }
            }
        }

        // Next level
        function nextLevel() {
            if (gameState.level >= 3) {
                // Game complete
                gameState.current = 'complete';
                return;
            }

            gameState.level++;
            currentMazeIndex = (currentMazeIndex + 1) % MAZES.length;
            currentMaze = MAZES[currentMazeIndex];

            // Reset player
            player.gridX = 1;
            player.gridY = 1;
            player.x = CELL_SIZE * 1.5;
            player.y = CELL_SIZE * 1.5;
            player.isStunned = false;

            // Reset dots
            dotSystem.dotsCollected = 0;
            spawnDot();

            // Respawn enemies
            spawnEnemies();
        }

        // Update timers
        function updateTimers() {
            // Message timer
            if (dotSystem.showMessage) {
                dotSystem.messageTimer--;
                if (dotSystem.messageTimer <= 0) {
                    dotSystem.showMessage = false;
                }
            }

            // Stun timer
            if (player.isStunned) {
                player.stunTimer--;

                // Apply knockback
                const newX = player.x + player.knockbackX * 0.1;
                const newY = player.y + player.knockbackY * 0.1;

                if (!checkWallCollision(newX, player.y)) {
                    player.x = newX;
                }
                if (!checkWallCollision(player.x, newY)) {
                    player.y = newY;
                }

                player.knockbackX *= 0.85;
                player.knockbackY *= 0.85;

                if (player.stunTimer <= 0) {
                    player.isStunned = false;
                }
            }

            // Whip timer
            if (player.isWhipping) {
                player.whipTimer--;
                if (player.whipTimer <= 0) {
                    player.isWhipping = false;
                }
            }

            // Whip cooldown
            if (player.whipCooldown > 0) {
                player.whipCooldown--;
            }
        }

        // Draw doctor sprite
        function drawDoctor(x, y, direction) {
            ctx.save();
            ctx.translate(x, y);

            // Rotate based on direction
            switch(direction) {
                case 'right': ctx.rotate(0); break;
                case 'left': ctx.rotate(Math.PI); break;
                case 'down': ctx.rotate(Math.PI / 2); break;
                case 'up': ctx.rotate(-Math.PI / 2); break;
            }

            // Body (white coat)
            ctx.fillStyle = player.isStunned ? '#aaa' : '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();

            // Head (skin tone)
            ctx.fillStyle = player.isStunned ? '#d4a574' : '#f4c2a0';
            ctx.beginPath();
            ctx.arc(0, -5, 8, 0, Math.PI * 2);
            ctx.fill();

            // Red cross
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(-2, -2, 4, 8);
            ctx.fillRect(-5, 1, 10, 2);

            // Eyes
            if (!player.isStunned) {
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-2, -6, 1.5, 0, Math.PI * 2);
                ctx.arc(2, -6, 1.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Stunned eyes (X X)
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-3, -7);
                ctx.lineTo(-1, -5);
                ctx.moveTo(-1, -7);
                ctx.lineTo(-3, -5);
                ctx.moveTo(1, -7);
                ctx.lineTo(3, -5);
                ctx.moveTo(3, -7);
                ctx.lineTo(1, -5);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Draw stethoscope whip
        function drawWhip(x, y, direction) {
            if (!player.isWhipping) return;

            ctx.save();
            ctx.translate(x, y);

            // Rotate based on direction
            switch(direction) {
                case 'right': ctx.rotate(0); break;
                case 'left': ctx.rotate(Math.PI); break;
                case 'down': ctx.rotate(Math.PI / 2); break;
                case 'up': ctx.rotate(-Math.PI / 2); break;
            }

            // Whip extends in front of player
            const whipLength = 40;
            const whipProgress = 1 - (player.whipTimer / 15); // 0 to 1

            // Stethoscope tube (whip)
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(15, 0);

            // Create whip arc motion
            const arcAmount = Math.sin(whipProgress * Math.PI) * 20;
            const whipX = 15 + whipLength * whipProgress;
            ctx.quadraticCurveTo(15 + whipLength / 2, arcAmount, whipX, 0);
            ctx.stroke();

            // Stethoscope head at end
            ctx.fillStyle = '#666666';
            ctx.beginPath();
            ctx.arc(whipX, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#999999';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(whipX, 0, 6, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        // Draw bug sprite
        function drawBug(x, y) {
            const theme = LEVEL_THEMES[Math.min(gameState.level, 3)];
            ctx.save();
            ctx.translate(x, y);

            if (gameState.level === 1) {

                ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = theme.enemyHeadColor;
                ctx.beginPath();
                ctx.arc(0, -8, 6, 0, Math.PI * 2);
                ctx.fill();

                // Antennae
                ctx.strokeStyle = theme.enemyColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-3, -10);
                ctx.lineTo(-6, -16);
                ctx.moveTo(3, -10);
                ctx.lineTo(6, -16);

                ctx.fillStyle = '#ff6b6b';

                ctx.arc(-6, -16, 2, 0, Math.PI * 2);

                // Legs
                ctx.strokeStyle = theme.enemyColor;

                ctx.moveTo(-10, 0);
                ctx.lineTo(-16, 0);
                ctx.moveTo(-8, 2);
                ctx.lineTo(-14, 5);
                ctx.moveTo(8, -2);
                ctx.lineTo(14, -5);
                ctx.moveTo(10, 0);
                ctx.lineTo(16, 0);
                ctx.moveTo(8, 2);
                ctx.lineTo(14, 5);

            } else if (gameState.level === 2) {

                ctx.fillStyle = theme.enemyHeadColor;

                ctx.arc(0, -10, 5, 0, Math.PI * 2);

                // Pincers
                ctx.strokeStyle = theme.enemyHeadColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-6, -10);
                ctx.lineTo(-10, -14);
                ctx.moveTo(6, -10);
                ctx.lineTo(10, -14);
                ctx.stroke();

                // Tail
                ctx.strokeStyle = theme.enemyColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 8);
                ctx.lineTo(3, 12);
                ctx.lineTo(5, 16);
                ctx.stroke();

                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(5, 16, 3, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Level 3: Beetle-like bugs
                ctx.fillStyle = theme.enemyColor;
                ctx.beginPath();
                ctx.ellipse(0, 0, 13, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                // Shell pattern
                ctx.strokeStyle = theme.enemyHeadColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -9);
                ctx.lineTo(0, 9);
                ctx.stroke();

                ctx.fillStyle = theme.enemyHeadColor;
                ctx.beginPath();
                ctx.arc(0, -10, 5, 0, Math.PI * 2);
                ctx.fill();

                // Antennae
                ctx.strokeStyle = theme.enemyColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-2, -12);
                ctx.lineTo(-4, -18);
                ctx.moveTo(2, -12);
                ctx.lineTo(4, -18);
                ctx.stroke();

                // Short legs
                ctx.strokeStyle = theme.enemyColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, 0);
                ctx.lineTo(-14, -3);
                ctx.moveTo(-10, 0);
                ctx.lineTo(-14, 3);
                ctx.moveTo(10, 0);
                ctx.lineTo(14, -3);
                ctx.moveTo(10, 0);
                ctx.lineTo(14, 3);

            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-2, -8, 1, 0, Math.PI * 2);
            ctx.arc(2, -8, 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Render
        function render() {
            const theme = LEVEL_THEMES[Math.min(gameState.level, 3)];

            // Update cursor style
            if (gameState.current === 'complete') {
                canvas.classList.add('clickable');
            } else {
                canvas.classList.remove('clickable');
            }

            // Start screen
            if (gameState.current === 'start') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw colorful bugs in background at 30% opacity
                const bugColors = ['#4a0e0e', '#6b1a6b', '#1a4d2e'];
                ctx.globalAlpha = 0.3;
                for (let i = 0; i < 15; i++) {
                    const x = (i * 60 + 40) % canvas.width;
                    const y = 100 + (Math.floor(i / 5) * 80);
                    const colorIndex = i % bugColors.length;
                    ctx.fillStyle = bugColors[colorIndex];

                    // Simple bug shape
                    ctx.beginPath();
                    ctx.ellipse(x, y, 12, 8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Bug legs
                    ctx.strokeStyle = bugColors[colorIndex];
                    ctx.lineWidth = 2;
                    for (let leg = 0; leg < 3; leg++) {
                        ctx.beginPath();
                        ctx.moveTo(x - 8, y - 4 + leg * 4);
                        ctx.lineTo(x - 15, y - 6 + leg * 4);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x + 8, y - 4 + leg * 4);
                        ctx.lineTo(x + 15, y - 6 + leg * 4);
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1.0;

                // Draw doctor sprite in center
                ctx.save();
                ctx.translate(canvas.width / 2, 280);

                // Body (white coat) - larger
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, 25, 0, Math.PI * 2);
                ctx.fill();

                // Head (skin tone) - larger
                ctx.fillStyle = '#f4c2a0';
                ctx.beginPath();
                ctx.arc(0, -10, 15, 0, Math.PI * 2);
                ctx.fill();

                // Big red cross
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-4, -4, 8, 16);
                ctx.fillRect(-10, 4, 20, 4);

                // Happy eyes (closed in joy)
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(-5, -12, 3, 0, Math.PI);
                ctx.arc(5, -12, 3, 0, Math.PI);
                ctx.stroke();

                // Big smile
                ctx.beginPath();

                    gradient.addColorStop(0, 'rgba(255, 140, 0, 0.6)');

                ctx.stroke();

                // Big smile
                ctx.beginPath();
                ctx.arc(0, -5, 8, 0.2 * Math.PI, 0.8 * Math.PI);

                // Arms raised in celebration

                ctx.stroke();

                // 5 orange dots around doctor
                const dotPositions = [

                dotPositions.forEach(pos => {

                    // Glow
                    const gradient = ctx.createRadialGradient(pos.x, pos.y, 12, pos.x, pos.y, 20);
                    gradient.addColorStop(0, 'rgba(255, 140, 0, 0.6)');
                    gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();

                // Text
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('BRA ATT DU FIXADE ALLA', canvas.width / 2, 40);
                ctx.fillText('VÅRDKONTAKTER', canvas.width / 2, 65);
                ctx.fillText('NU KAN NÅN SÄKERT', canvas.width / 2, 90);
                ctx.fillText('TA UT SUPERVIKTIG STATISTIK', canvas.width / 2, 115);

                // Restart instruction
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px Arial';
                ctx.fillText('Klicka här eller tryck på options-knappen', canvas.width / 2, canvas.height - 45);
                ctx.fillText('för att spela igen', canvas.width / 2, canvas.height - 25);

                return;
            }

            // Clear canvas
            ctx.fillStyle = theme.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw maze
            for (let y = 0; y < MAZE_HEIGHT; y++) {
                for (let x = 0; x < MAZE_WIDTH; x++) {
                    if (currentMaze[y][x] === 1) {
                        // Wall
                        ctx.fillStyle = theme.wallColor;
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = theme.wallBorder;
                        ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                        // Draw COSMIC text in some walls
                        if ((x === 3 && y === 2) || (x === 6 && y === 4)) {
                            ctx.save();
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                            ctx.font = 'bold 12px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('COSMIC', x * CELL_SIZE + CELL_SIZE / 2, y * CELL_SIZE + CELL_SIZE / 2);
                            ctx.restore();
                        }
                    } else if (currentMaze[y][x] === 2) {
                        // Door
                        if (dotSystem.dotsCollected >= 5) {
                            ctx.fillStyle = '#00ff00';
                        } else {
                            ctx.fillStyle = '#ff0000';
                        }
                        ctx.fillRect(x * CELL_SIZE + 5, y * CELL_SIZE + 5, CELL_SIZE - 10, CELL_SIZE - 10);

                        // Door details
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x * CELL_SIZE + 5, y * CELL_SIZE + 5, CELL_SIZE - 10, CELL_SIZE - 10);
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(x * CELL_SIZE + 25, y * CELL_SIZE + CELL_SIZE / 2, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Draw dot (only if less than 5 collected) with blinking
            if (dotSystem.dotsCollected < 5) {
                const blinkIntensity = (Math.sin(gameTime * 0.05) + 1) / 2; // 0 to 1
                const opacity = 0.5 + blinkIntensity * 0.5; // 0.5 to 1

                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.fillStyle = '#ff8c00';
                ctx.beginPath();
                ctx.arc(dotSystem.x, dotSystem.y, dotSystem.size, 0, Math.PI * 2);
                ctx.fill();

                // Glow effect
                const gradient = ctx.createRadialGradient(dotSystem.x, dotSystem.y, dotSystem.size, dotSystem.x, dotSystem.y, dotSystem.size * 2);
                gradient.addColorStop(0, 'rgba(255, 140, 0, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(dotSystem.x, dotSystem.y, dotSystem.size * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw enemies
            enemies.forEach(enemy => {
                drawBug(enemy.x, enemy.y);
            });

            // Draw player
            drawDoctor(player.x, player.y, player.direction);

            // Draw whip attack
            drawWhip(player.x, player.y, player.direction);

            // Draw UI
            ctx.fillStyle = '#fff';

            // Adjust font size for longer level names
            const fontSize = gameState.level === 3 ? 15 : 18;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.fillText(theme.name, 10, 25);

            ctx.font = 'bold 18px Arial';
            ctx.fillText(`Dots: ${dotSystem.dotsCollected}/5`, 10, 50);

            // Draw VÅRDKONTAKT message
            if (dotSystem.showMessage) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, canvas.height / 2 - 80, canvas.width, 160);

                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 72px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('VÅRDKONTAKT!', canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }

            // Draw level complete message
            if (dotSystem.dotsCollected >= 5) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 100, 0, 0.8)';
                ctx.fillRect(0, 50, canvas.width, 100);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const lines = theme.completeMessage.split('\n');
                lines.forEach((line, index) => {
                    ctx.fillText(line, canvas.width / 2, 85 + index * 30);
                });
                ctx.restore();
            }
        }

        // Game loop
        function gameLoop() {
            gameTime++;
            processInput();
            updateEnemies();
            checkCollisions();
            updateTimers();
            render();

            requestAnimationFrame(gameLoop);
        }

        // Start game
        init();
    </script>
</body>
</html>
