<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC Showdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(100, 100, 200, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        canvas.width = 1000;
        canvas.height = 600;

        // Load sprite sheet directly (no processing for now)
        const spriteSheet = new Image();
        spriteSheet.src = 'doctor.png';
        let spriteLoaded = false;
        spriteSheet.onload = () => {
            spriteLoaded = true;
            console.log('Sprite loaded:', spriteSheet.width, 'x', spriteSheet.height);
        };
        spriteSheet.onerror = () => {
            console.error('Failed to load sprite sheet!');
        };

        // Sprite animation definitions
        // Based on the sprite sheet layout: RUNNING (8), JUMPING (6), THROWING (6), DAMAGED (6)
        // Image is 384x216, labels take ~76px, 4 rows of 54px each
        const SPRITE = {
            frameWidth: 38,
            frameHeight: 50,
            startX: 76,  // After the labels
            rowHeight: 54,
            scale: 1.8,  // Scale up the sprite for better visibility
            animations: {
                running: { row: 0, frames: 8, speed: 5, rowY: 4 },
                jumping: { row: 1, frames: 6, speed: 8, rowY: 58 },
                throwing: { row: 2, frames: 6, speed: 6, rowY: 112 },
                damaged: { row: 3, frames: 6, speed: 4, rowY: 166 }
            }
        };

        // Game states
        const STATES = { TITLE: 0, PLAYING: 1, VICTORY: 2, GAMEOVER: 3 };
        let gameState = STATES.TITLE;

        // Camera
        let camera = { x: 0, y: 0, shake: 0 };

        // Particles
        let particles = [];

        // Player
        const player = {
            x: 100,
            y: 400,
            width: 36,
            height: 60,
            vx: 0,
            vy: 0,
            speed: 6,
            jumpForce: -15,
            gravity: 0.6,
            grounded: false,
            coyoteTime: 0,
            maxCoyote: 8,
            health: 3,
            maxHealth: 3,
            invincible: 0,
            facingRight: true,
            // Animation state
            animState: 'running',
            animFrame: 0,
            animTimer: 0,
            damageAnimTimer: 0
        };

        // Level width
        const LEVEL_WIDTH = 5000;
        const BOSS_ARENA_START = 4200;

        // Platforms
        const platforms = [
            // Starting area
            { x: 0, y: 550, width: 500, height: 50, type: 'static' },
            { x: 200, y: 450, width: 100, height: 20, type: 'static' },
            { x: 400, y: 380, width: 100, height: 20, type: 'static' },

            // Moving platforms section
            { x: 550, y: 400, width: 120, height: 20, type: 'moving', moveX: 100, moveY: 0, speed: 2 },
            { x: 750, y: 350, width: 100, height: 20, type: 'static' },
            { x: 900, y: 300, width: 120, height: 20, type: 'moving', moveX: 0, moveY: 80, speed: 1.5 },
            { x: 1100, y: 350, width: 150, height: 20, type: 'static' },

            // Gap jumps
            { x: 1350, y: 400, width: 100, height: 20, type: 'static' },
            { x: 1550, y: 350, width: 100, height: 20, type: 'static' },
            { x: 1750, y: 300, width: 150, height: 20, type: 'static' },

            // Enemy section platforms
            { x: 1950, y: 550, width: 600, height: 50, type: 'static' },
            { x: 2100, y: 450, width: 150, height: 20, type: 'static' },
            { x: 2350, y: 400, width: 100, height: 20, type: 'static' },

            // More moving platforms
            { x: 2600, y: 450, width: 120, height: 20, type: 'moving', moveX: 150, moveY: 0, speed: 2.5 },
            { x: 2900, y: 400, width: 100, height: 20, type: 'static' },
            { x: 3100, y: 350, width: 120, height: 20, type: 'moving', moveX: 0, moveY: 100, speed: 2 },

            // Pre-boss area
            { x: 3350, y: 450, width: 200, height: 20, type: 'static' },
            { x: 3650, y: 500, width: 150, height: 20, type: 'static' },
            { x: 3900, y: 550, width: 300, height: 50, type: 'static' },

            // Boss arena
            { x: BOSS_ARENA_START, y: 550, width: 800, height: 50, type: 'static' }
        ];

        // Store original positions for moving platforms
        platforms.forEach(p => {
            if (p.type === 'moving') {
                p.origX = p.x;
                p.origY = p.y;
                p.phase = Math.random() * Math.PI * 2;
            }
        });

        // Enemies
        const enemies = [
            { x: 2050, y: 500, width: 40, height: 50, vx: 2, minX: 2000, maxX: 2450, alive: true },
            { x: 2200, y: 400, width: 40, height: 50, vx: -2, minX: 2100, maxX: 2250, alive: true },
            { x: 3400, y: 400, width: 40, height: 50, vx: 2, minX: 3350, maxX: 3550, alive: true },
            { x: 3700, y: 450, width: 40, height: 50, vx: -2, minX: 3650, maxX: 3800, alive: true }
        ];

        // Boss
        const boss = {
            x: BOSS_ARENA_START + 400,
            y: 250,
            width: 200,
            height: 250,
            hp: 10,
            maxHp: 10,
            phase: 0,
            attackTimer: 0,
            attackCooldown: 120,
            currentAttack: null,
            arms: [
                { x: 0, y: 0, angle: 0, slamming: false, slamProgress: 0 },
                { x: 0, y: 0, angle: 0, slamming: false, slamProgress: 0 }
            ],
            vulnerable: false,
            vulnerableTimer: 0,
            hitCooldown: 0,
            faceExpression: 'neutral',
            defeated: false,
            deathAnimation: 0
        };

        // Projectiles (boss attacks)
        let projectiles = [];

        // Input
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                if (gameState === STATES.TITLE) {
                    resetGame();
                    gameState = STATES.PLAYING;
                } else if (gameState === STATES.VICTORY || gameState === STATES.GAMEOVER) {
                    gameState = STATES.TITLE;
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function resetGame() {
            player.x = 100;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.health = player.maxHealth;
            player.invincible = 0;
            player.animState = 'running';
            player.animFrame = 0;
            player.animTimer = 0;
            player.damageAnimTimer = 0;
            camera.x = 0;
            camera.shake = 0;

            boss.hp = boss.maxHp;
            boss.defeated = false;
            boss.deathAnimation = 0;
            boss.attackTimer = 0;
            boss.vulnerable = false;
            boss.arms[0].slamming = false;
            boss.arms[1].slamming = false;

            enemies.forEach(e => e.alive = true);
            projectiles = [];
            particles = [];
        }

        function spawnParticles(x, y, color, count, spread) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * spread,
                    vy: (Math.random() - 0.5) * spread - 2,
                    life: 30 + Math.random() * 20,
                    color,
                    size: 3 + Math.random() * 4
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                p.size *= 0.95;
                return p.life > 0;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 50;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x - camera.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        function updatePlayer() {
            // Horizontal movement
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
                player.facingRight = false;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
                player.facingRight = true;
            } else {
                player.vx *= 0.8;
            }

            // Coyote time
            if (player.grounded) {
                player.coyoteTime = player.maxCoyote;
            } else {
                player.coyoteTime--;
            }

            // Jump
            if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.coyoteTime > 0) {
                player.vy = player.jumpForce;
                player.coyoteTime = 0;
                spawnParticles(player.x + player.width/2, player.y + player.height, '#ffffff', 5, 4);
            }

            // Gravity
            player.vy += player.gravity;
            if (player.vy > 15) player.vy = 15;

            // Move and collide
            player.x += player.vx;
            player.y += player.vy;
            player.grounded = false;

            // Platform collision
            platforms.forEach(plat => {
                if (rectCollision(player, plat)) {
                    // Vertical collision
                    if (player.vy > 0 && player.y + player.height - player.vy <= plat.y + 10) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;

                        // Move with moving platform
                        if (plat.type === 'moving' && plat.lastX !== undefined) {
                            player.x += plat.x - plat.lastX;
                        }
                    } else if (player.vy < 0 && player.y - player.vy >= plat.y + plat.height - 10) {
                        player.y = plat.y + plat.height;
                        player.vy = 0;
                    } else if (player.vx > 0) {
                        player.x = plat.x - player.width;
                    } else if (player.vx < 0) {
                        player.x = plat.x + plat.width;
                    }
                }
            });

            // World bounds
            if (player.x < 0) player.x = 0;
            if (player.x > LEVEL_WIDTH - player.width) player.x = LEVEL_WIDTH - player.width;

            // Fall death
            if (player.y > 700) {
                player.health = 0;
            }

            // Invincibility
            if (player.invincible > 0) player.invincible--;

            // Update damage animation timer
            if (player.damageAnimTimer > 0) player.damageAnimTimer--;

            // Determine animation state
            let newAnimState = 'running';
            let isIdle = false;
            if (player.damageAnimTimer > 0) {
                newAnimState = 'damaged';
            } else if (!player.grounded) {
                newAnimState = 'jumping';
            } else if (Math.abs(player.vx) > 0.5) {
                newAnimState = 'running';
            } else {
                // Idle - use first frame of running
                newAnimState = 'running';
                isIdle = true;
            }

            // Reset animation frame if state changed
            if (newAnimState !== player.animState) {
                player.animState = newAnimState;
                player.animFrame = 0;
                player.animTimer = 0;
            }

            // Update animation frame (freeze on frame 0 when idle)
            if (isIdle) {
                player.animFrame = 0;
                player.animTimer = 0;
            } else {
                const anim = SPRITE.animations[player.animState];
                player.animTimer++;
                if (player.animTimer >= anim.speed) {
                    player.animTimer = 0;
                    player.animFrame++;
                    if (player.animFrame >= anim.frames) {
                        player.animFrame = 0;
                    }
                }
            }

            // Check game over
            if (player.health <= 0) {
                gameState = STATES.GAMEOVER;
            }
        }

        function updatePlatforms() {
            platforms.forEach(p => {
                if (p.type === 'moving') {
                    p.lastX = p.x;
                    p.lastY = p.y;
                    p.phase += 0.02 * p.speed;
                    p.x = p.origX + Math.sin(p.phase) * p.moveX;
                    p.y = p.origY + Math.sin(p.phase) * p.moveY;
                }
            });
        }

        function updateEnemies() {
            enemies.forEach(enemy => {
                if (!enemy.alive) return;

                enemy.x += enemy.vx;
                if (enemy.x <= enemy.minX || enemy.x + enemy.width >= enemy.maxX) {
                    enemy.vx *= -1;
                }

                // Player collision
                if (player.invincible <= 0 && rectCollision(player, enemy)) {
                    // Check if stomping
                    if (player.vy > 0 && player.y + player.height < enemy.y + enemy.height/2) {
                        enemy.alive = false;
                        player.vy = -10;
                        spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff6666', 10, 6);
                        camera.shake = 5;
                    } else {
                        damagePlayer();
                    }
                }
            });
        }

        function damagePlayer() {
            if (player.invincible > 0) return;
            player.health--;
            player.invincible = 90;
            player.damageAnimTimer = 30; // Play damage animation for 30 frames
            camera.shake = 10;
            spawnParticles(player.x + player.width/2, player.y + player.height/2, '#ff4444', 8, 5);
        }

        function updateBoss() {
            if (boss.defeated) {
                boss.deathAnimation++;
                if (boss.deathAnimation % 10 === 0) {
                    spawnParticles(
                        boss.x + Math.random() * boss.width,
                        boss.y + Math.random() * boss.height,
                        '#ffaa00', 10, 8
                    );
                    camera.shake = 8;
                }
                if (boss.deathAnimation > 120) {
                    gameState = STATES.VICTORY;
                }
                return;
            }

            // Only activate when player is in arena
            if (player.x < BOSS_ARENA_START) return;

            boss.hitCooldown--;
            boss.attackTimer++;

            // Update arms position
            boss.arms[0].x = boss.x - 60;
            boss.arms[0].y = boss.y + 150;
            boss.arms[1].x = boss.x + boss.width + 10;
            boss.arms[1].y = boss.y + 150;

            // Attack patterns
            if (boss.attackTimer >= boss.attackCooldown && !boss.arms[0].slamming && !boss.arms[1].slamming) {
                boss.attackTimer = 0;
                const attack = Math.floor(Math.random() * 3);

                if (attack === 0 || attack === 1) {
                    // Arm slam
                    const armIndex = attack === 0 ? 0 : 1;
                    boss.arms[armIndex].slamming = true;
                    boss.arms[armIndex].slamProgress = 0;
                    boss.faceExpression = 'angry';
                } else {
                    // Projectile attack
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            if (!boss.defeated) {
                                projectiles.push({
                                    x: boss.x + boss.width/2,
                                    y: boss.y + boss.height/2,
                                    vx: (player.x - boss.x) * 0.02 + (Math.random() - 0.5) * 3,
                                    vy: 3 + Math.random() * 2,
                                    size: 15
                                });
                            }
                        }, i * 100);
                    }
                    boss.faceExpression = 'shooting';
                    setTimeout(() => { boss.faceExpression = 'neutral'; }, 600);
                }
            }

            // Update arm slams
            boss.arms.forEach((arm, idx) => {
                if (arm.slamming) {
                    arm.slamProgress++;

                    // Wind up
                    if (arm.slamProgress < 30) {
                        arm.angle = (idx === 0 ? -1 : 1) * (arm.slamProgress / 30) * 0.5;
                    }
                    // Slam down
                    else if (arm.slamProgress < 45) {
                        arm.angle = (idx === 0 ? -1 : 1) * (1 - (arm.slamProgress - 30) / 15) * 1.5;

                        // Check hit at slam point
                        if (arm.slamProgress === 40) {
                            const slamX = arm.x + (idx === 0 ? -50 : 100);
                            const slamY = 500;

                            if (Math.abs(player.x + player.width/2 - slamX) < 80 && player.y + player.height > 480) {
                                damagePlayer();
                            }

                            spawnParticles(slamX, slamY, '#888888', 15, 10);
                            camera.shake = 15;
                            boss.vulnerable = true;
                            boss.vulnerableTimer = 60;
                        }
                    }
                    // Recovery
                    else if (arm.slamProgress < 90) {
                        arm.angle *= 0.9;
                    }
                    else {
                        arm.slamming = false;
                        arm.angle = 0;
                        boss.faceExpression = 'neutral';
                    }
                }
            });

            // Vulnerability window
            if (boss.vulnerableTimer > 0) {
                boss.vulnerableTimer--;
                if (boss.vulnerableTimer <= 0) {
                    boss.vulnerable = false;
                }
            }

            // Player damaging boss (jump on head or hit during vulnerable)
            if (boss.hitCooldown <= 0) {
                const headHitbox = { x: boss.x + 20, y: boss.y, width: boss.width - 40, height: 50 };

                if (player.vy > 0 && rectCollision(player, headHitbox)) {
                    hitBoss();
                    player.vy = -12;
                } else if (boss.vulnerable && rectCollision(player, boss)) {
                    hitBoss();
                }
            }

            // Projectile collision with player
            projectiles = projectiles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.y > 600 || p.x < BOSS_ARENA_START || p.x > LEVEL_WIDTH) return false;

                if (player.invincible <= 0 &&
                    Math.abs(p.x - player.x - player.width/2) < p.size + player.width/2 &&
                    Math.abs(p.y - player.y - player.height/2) < p.size + player.height/2) {
                    damagePlayer();
                    return false;
                }

                return true;
            });
        }

        function hitBoss() {
            boss.hp--;
            boss.hitCooldown = 30;
            boss.faceExpression = 'hurt';
            setTimeout(() => { if (!boss.defeated) boss.faceExpression = 'neutral'; }, 300);
            camera.shake = 20;
            spawnParticles(boss.x + boss.width/2, boss.y + 50, '#00ffff', 15, 8);

            if (boss.hp <= 0) {
                boss.defeated = true;
                boss.faceExpression = 'defeated';
            }
        }

        function updateCamera() {
            const targetX = player.x - canvas.width / 3;
            camera.x += (targetX - camera.x) * 0.1;

            if (camera.x < 0) camera.x = 0;
            if (camera.x > LEVEL_WIDTH - canvas.width) camera.x = LEVEL_WIDTH - canvas.width;

            if (camera.shake > 0) {
                camera.shake *= 0.9;
            }
        }

        function rectCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        // Drawing functions
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a3e');
            gradient.addColorStop(0.5, '#2d2d5a');
            gradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                const x = (i * 137 + camera.x * 0.1) % canvas.width;
                const y = (i * 89) % (canvas.height - 100);
                const size = (i % 3) + 1;
                ctx.globalAlpha = 0.3 + (i % 5) * 0.15;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawPlatforms() {
            platforms.forEach(p => {
                const x = p.x - camera.x;
                const gradient = ctx.createLinearGradient(x, p.y, x, p.y + p.height);
                gradient.addColorStop(0, '#5a5a8a');
                gradient.addColorStop(1, '#3a3a5a');

                ctx.fillStyle = gradient;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;
                ctx.fillRect(x, p.y, p.width, p.height);
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // Top highlight
                ctx.fillStyle = '#7a7aaa';
                ctx.fillRect(x, p.y, p.width, 4);
            });
        }

        // DEBUG: Set to true to see sprite sheet and extraction areas
        const DEBUG_SPRITES = true;

        function drawPlayer() {
            if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) return;

            const x = player.x - camera.x;
            const y = player.y;

            // Always reset path to prevent triangle artifacts
            ctx.beginPath();

            if (spriteLoaded && spriteSheet.complete) {
                // Calculate sprite source coordinates
                const anim = SPRITE.animations[player.animState];
                const srcX = SPRITE.startX + player.animFrame * SPRITE.frameWidth;
                const srcY = anim.rowY;

                // Destination dimensions (scaled up)
                const destW = SPRITE.frameWidth * SPRITE.scale;
                const destH = SPRITE.frameHeight * SPRITE.scale;

                // Draw sprite
                ctx.save();
                if (!player.facingRight) {
                    ctx.translate(x + player.width, y);
                    ctx.scale(-1, 1);
                    ctx.drawImage(
                        spriteSheet,
                        srcX, srcY, SPRITE.frameWidth, SPRITE.frameHeight,
                        0, 0, destW, destH
                    );
                } else {
                    ctx.drawImage(
                        spriteSheet,
                        srcX, srcY, SPRITE.frameWidth, SPRITE.frameHeight,
                        x, y, destW, destH
                    );
                }
                ctx.restore();

                // DEBUG: Draw sprite sheet and show extraction rectangle
                if (DEBUG_SPRITES) {
                    ctx.save();

                    // Scale down to fit - draw at 0.25 scale
                    const debugScale = 0.25;
                    const debugW = spriteSheet.width * debugScale;
                    const debugH = spriteSheet.height * debugScale;

                    // Draw the whole sprite sheet scaled down
                    ctx.drawImage(spriteSheet, 10, 80, debugW, debugH);

                    // Draw rectangle showing what we're extracting (also scaled)
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(
                        10 + srcX * debugScale,
                        80 + srcY * debugScale,
                        SPRITE.frameWidth * debugScale,
                        SPRITE.frameHeight * debugScale
                    );

                    // Show info
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText(`Sheet: ${spriteSheet.width}x${spriteSheet.height}`, 10, 75);
                    ctx.fillText(`Src: (${srcX}, ${srcY}) ${SPRITE.frameWidth}x${SPRITE.frameHeight}`, 10, 80 + debugH + 20);
                    ctx.fillText(`Frame: ${player.animFrame}, State: ${player.animState}`, 10, 80 + debugH + 40);
                    ctx.restore();
                }
            } else {
                // Fallback to simple blue rectangle if sprite not loaded
                ctx.fillStyle = '#44aaff';
                ctx.fillRect(x, y, player.width, player.height);

                // Show loading status
                ctx.fillStyle = '#ffff00';
                ctx.font = '14px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Sprite loading...', 10, 75);
            }
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                if (!enemy.alive) return;

                const x = enemy.x - camera.x;
                const gradient = ctx.createLinearGradient(x, enemy.y, x + enemy.width, enemy.y + enemy.height);
                gradient.addColorStop(0, '#ff6666');
                gradient.addColorStop(1, '#cc3333');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, enemy.y, enemy.width, enemy.height);

                // Angry eyes
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 5, enemy.y + 12, 10, 8);
                ctx.fillRect(x + 25, enemy.y + 12, 10, 8);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 8, enemy.y + 14, 4, 4);
                ctx.fillRect(x + 28, enemy.y + 14, 4, 4);

                // Angry eyebrows
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + 5, enemy.y + 8);
                ctx.lineTo(x + 15, enemy.y + 12);
                ctx.moveTo(x + 35, enemy.y + 8);
                ctx.lineTo(x + 25, enemy.y + 12);
                ctx.stroke();
            });
        }

        function drawBoss() {
            if (player.x < BOSS_ARENA_START - 200) return;

            const x = boss.x - camera.x;
            const y = boss.y;

            // Death animation fade
            if (boss.defeated) {
                ctx.globalAlpha = Math.max(0, 1 - boss.deathAnimation / 120);
            }

            // Arms
            boss.arms.forEach((arm, idx) => {
                ctx.save();
                const armX = arm.x - camera.x;
                ctx.translate(armX + 25, arm.y);
                ctx.rotate(arm.angle);

                // Upper arm
                const armGradient = ctx.createLinearGradient(0, 0, 50, 80);
                armGradient.addColorStop(0, '#888888');
                armGradient.addColorStop(1, '#555555');
                ctx.fillStyle = armGradient;
                ctx.fillRect(-15, 0, 30, 80);

                // Hand/fist
                ctx.fillStyle = '#666666';
                ctx.beginPath();
                ctx.arc(0, 90, 25, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            // Main body (monitor)
            const bodyGradient = ctx.createLinearGradient(x, y, x, y + boss.height);
            bodyGradient.addColorStop(0, '#4a4a6a');
            bodyGradient.addColorStop(1, '#2a2a4a');
            ctx.fillStyle = bodyGradient;
            ctx.fillRect(x, y, boss.width, boss.height);

            // Screen
            const screenGradient = ctx.createLinearGradient(x + 15, y + 15, x + 15, y + 180);
            screenGradient.addColorStop(0, boss.vulnerable ? '#00ff88' : '#111133');
            screenGradient.addColorStop(1, boss.vulnerable ? '#00aa55' : '#000011');
            ctx.fillStyle = screenGradient;
            ctx.fillRect(x + 15, y + 15, boss.width - 30, 170);

            // COSMIC text
            ctx.fillStyle = boss.vulnerable ? '#ffffff' : '#00ffaa';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('COSMIC', x + boss.width/2, y + 55);

            // Face on screen
            const faceY = y + 100;

            // Eyes
            ctx.fillStyle = '#00ffaa';
            if (boss.faceExpression === 'hurt') {
                // X eyes when hurt
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(x + 55, faceY - 10);
                ctx.lineTo(x + 75, faceY + 10);
                ctx.moveTo(x + 75, faceY - 10);
                ctx.lineTo(x + 55, faceY + 10);
                ctx.moveTo(x + 125, faceY - 10);
                ctx.lineTo(x + 145, faceY + 10);
                ctx.moveTo(x + 145, faceY - 10);
                ctx.lineTo(x + 125, faceY + 10);
                ctx.stroke();
            } else if (boss.faceExpression === 'defeated') {
                // Spiral eyes
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 2;
                for (let eye = 0; eye < 2; eye++) {
                    const ex = x + (eye === 0 ? 65 : 135);
                    ctx.beginPath();
                    for (let i = 0; i < 20; i++) {
                        const angle = i * 0.5;
                        const r = i * 1;
                        ctx.lineTo(ex + Math.cos(angle) * r, faceY + Math.sin(angle) * r);
                    }
                    ctx.stroke();
                }
            } else {
                // Normal eyes
                ctx.beginPath();
                ctx.arc(x + 65, faceY, 15, 0, Math.PI * 2);
                ctx.arc(x + 135, faceY, 15, 0, Math.PI * 2);
                ctx.fill();

                // Pupils track player
                const dx = (player.x - boss.x) / 200;
                ctx.fillStyle = '#003322';
                ctx.beginPath();
                ctx.arc(x + 65 + dx * 5, faceY + 2, 6, 0, Math.PI * 2);
                ctx.arc(x + 135 + dx * 5, faceY + 2, 6, 0, Math.PI * 2);
                ctx.fill();

                // Angry eyebrows when attacking
                if (boss.faceExpression === 'angry' || boss.faceExpression === 'shooting') {
                    ctx.strokeStyle = '#00ffaa';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(x + 45, faceY - 25);
                    ctx.lineTo(x + 80, faceY - 15);
                    ctx.moveTo(x + 155, faceY - 25);
                    ctx.lineTo(x + 120, faceY - 15);
                    ctx.stroke();
                }
            }

            // Mouth
            ctx.strokeStyle = boss.faceExpression === 'hurt' ? '#ff0000' : '#00ffaa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (boss.faceExpression === 'angry' || boss.faceExpression === 'shooting') {
                // Open mouth
                ctx.arc(x + boss.width/2, faceY + 50, 20, 0, Math.PI);
            } else if (boss.faceExpression === 'hurt' || boss.faceExpression === 'defeated') {
                // Wavy distressed mouth
                ctx.moveTo(x + 70, faceY + 55);
                ctx.lineTo(x + 85, faceY + 45);
                ctx.lineTo(x + 100, faceY + 55);
                ctx.lineTo(x + 115, faceY + 45);
                ctx.lineTo(x + 130, faceY + 55);
            } else {
                // Flat line
                ctx.moveTo(x + 70, faceY + 50);
                ctx.lineTo(x + 130, faceY + 50);
            }
            ctx.stroke();

            // Stand
            ctx.fillStyle = '#3a3a5a';
            ctx.fillRect(x + 70, y + boss.height, 60, 30);
            ctx.fillRect(x + 50, y + boss.height + 25, 100, 15);

            // HP Bar
            if (!boss.defeated) {
                const hpBarWidth = 180;
                const hpBarHeight = 20;
                const hpBarX = x + (boss.width - hpBarWidth) / 2;
                const hpBarY = y - 40;

                // Background
                ctx.fillStyle = '#333333';
                ctx.fillRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);

                // HP fill
                const hpPercent = boss.hp / boss.maxHp;
                const hpGradient = ctx.createLinearGradient(hpBarX, hpBarY, hpBarX + hpBarWidth * hpPercent, hpBarY);
                hpGradient.addColorStop(0, '#ff3333');
                hpGradient.addColorStop(1, '#ff6666');
                ctx.fillStyle = hpGradient;
                ctx.fillRect(hpBarX + 2, hpBarY + 2, (hpBarWidth - 4) * hpPercent, hpBarHeight - 4);

                // Border
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(hpBarX, hpBarY, hpBarWidth, hpBarHeight);

                // HP text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${boss.hp}/${boss.maxHp}`, hpBarX + hpBarWidth/2, hpBarY + 15);
            }

            ctx.globalAlpha = 1;
        }

        function drawProjectiles() {
            projectiles.forEach(p => {
                const gradient = ctx.createRadialGradient(p.x - camera.x, p.y, 0, p.x - camera.x, p.y, p.size);
                gradient.addColorStop(0, '#ff00ff');
                gradient.addColorStop(0.5, '#aa00aa');
                gradient.addColorStop(1, '#550055');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x - camera.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawHUD() {
            // Health hearts
            for (let i = 0; i < player.maxHealth; i++) {
                ctx.fillStyle = i < player.health ? '#ff4444' : '#444444';
                ctx.beginPath();
                const hx = 30 + i * 40;
                const hy = 30;
                ctx.moveTo(hx, hy + 5);
                ctx.bezierCurveTo(hx, hy, hx - 10, hy, hx - 10, hy + 10);
                ctx.bezierCurveTo(hx - 10, hy + 20, hx, hy + 25, hx, hy + 30);
                ctx.bezierCurveTo(hx, hy + 25, hx + 10, hy + 20, hx + 10, hy + 10);
                ctx.bezierCurveTo(hx + 10, hy, hx, hy, hx, hy + 5);
                ctx.fill();
            }
        }

        function drawTitleScreen() {
            drawBackground();

            // Title
            ctx.fillStyle = '#00ffaa';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00ffaa';
            ctx.shadowBlur = 20;
            ctx.fillText('COSMIC SHOWDOWN', canvas.width/2, 200);
            ctx.shadowBlur = 0;

            // Subtitle
            ctx.fillStyle = '#8888aa';
            ctx.font = '24px Arial';
            ctx.fillText('A 1-Minute Platformer', canvas.width/2, 260);

            // Instructions
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px Arial';
            ctx.fillText('Arrow Keys / WASD to Move', canvas.width/2, 350);
            ctx.fillText('Space / Up / W to Jump', canvas.width/2, 380);
            ctx.fillText('Stomp enemies from above!', canvas.width/2, 410);

            // Start prompt
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 28px Arial';
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('PRESS SPACE TO START', canvas.width/2, 500);
            ctx.globalAlpha = 1;
        }

        function drawVictoryScreen() {
            drawBackground();

            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 20;
            ctx.fillText('VICTORY!', canvas.width/2, 200);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = '32px Arial';
            ctx.fillText('You defeated COSMIC!', canvas.width/2, 300);

            ctx.fillStyle = '#ffff00';
            ctx.font = '24px Arial';
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('Press Space to Play Again', canvas.width/2, 450);
            ctx.globalAlpha = 1;
        }

        function drawGameOverScreen() {
            drawBackground();

            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 20;
            ctx.fillText('GAME OVER', canvas.width/2, 200);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = '32px Arial';
            ctx.fillText('COSMIC wins this round...', canvas.width/2, 300);

            ctx.fillStyle = '#ffff00';
            ctx.font = '24px Arial';
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('Press Space to Try Again', canvas.width/2, 450);
            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            // Apply camera shake
            ctx.save();
            if (camera.shake > 0.5) {
                ctx.translate(
                    (Math.random() - 0.5) * camera.shake,
                    (Math.random() - 0.5) * camera.shake
                );
            }

            if (gameState === STATES.TITLE) {
                drawTitleScreen();
            } else if (gameState === STATES.PLAYING) {
                updatePlatforms();
                updatePlayer();
                updateEnemies();
                updateBoss();
                updateCamera();
                updateParticles();

                drawBackground();
                drawPlatforms();
                drawEnemies();
                drawPlayer();
                drawBoss();
                drawProjectiles();
                drawParticles();
                drawHUD();
            } else if (gameState === STATES.VICTORY) {
                drawVictoryScreen();
            } else if (gameState === STATES.GAMEOVER) {
                drawGameOverScreen();
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
